# Keeps the commit-SHA pins in .github/workflows current: third-party actions are pinned
# to a full commit (with the version as a comment), so a moved or hijacked tag can't change
# what runs next to the release-signing keystore.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # The Gradle wrapper, plugins and libraries (gradle/libs.versions.toml). Minor and patch
  # updates come as one PR a week; a major update gets its own. Dependabot's commits don't
  # make a release on their own (create-release.yml's compute-version skips a push whose
  # commits since the last release are all Dependabot's): they go out with the next one.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch
