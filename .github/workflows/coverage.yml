name: Coverage

# Combined unit + instrumented coverage report, from the instrumented-test-coverage
# artifact ci.yml's instrumented-tests job uploads earlier in the same run. Called by
# create-release.yml next to its release job, so publishing a release doesn't wait
# for the report. PR and manual CI runs build the report inside instrumented-tests.

on:
  workflow_call:

jobs:
  coverage-report:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      # Caches Gradle's dependencies and its build cache (with --build-cache) between runs:
      # written from main, read on branches. Unchanged tasks come from the cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # One .ec file per test half (ci.yml's instrumented-shard), each in a folder of its own:
      # jacocoTestReport reads every .ec it finds there and merges them.
      - name: Download Instrumented Test Coverage Data
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: instrumented-test-coverage-*
          path: app/build/outputs/code_coverage/debugAndroidTest/connected

      # Re-runs unit tests here (cheap, no device needed) purely to
      # regenerate the .exec file jacocoTestReport needs from a fresh
      # classpath — the instrumented .ec downloaded above is the one piece
      # that genuinely can't be regenerated without a device.
      - name: Generate Coverage Report
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew jacocoTestReport --build-cache --stacktrace

      - name: Upload Coverage Report
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/html
