name: Daily Facebook check

# Runs LiveFacebookCanaryTest, the app against today's real m.facebook.com, to catch Facebook
# changing the pages the app's scripts rely on (the CI checks run on fixed test pages and can't).
# Logged in to a Facebook TEST account through its session cookies in the FB_TEST_COOKIES secret
# ("c_user=...; xs=...; datr=..."), set by the repo owner (gh secret set FB_TEST_COOKIES); never
# a personal account. Nothing is posted: the checks stop at open editors. The Messages layer checks
# need a chat named by the FB_TEST_CHAT secret (its address, e2ee/t/<id> or a bare id) and are
# skipped without it. Leave it unset: the test account's chat is end-to-end encrypted, and this
# emulator, logged in by cookies alone, gets the chat's restore prompt instead of its messages
# (tried 2026-10-24, all three failed). They run on the local emulator (tools/canary.ps1 -Chat).
#
# A failure opens (or comments on) one "Daily Facebook check failed" issue; the next passing run
# closes it. "Facebook session expired" in the issue means the cookies need replacing. A part of
# the checks with nothing to check (no ad came) 7 runs in a row opens a second issue ("Report gaps").

on:
  # GitHub starts scheduled runs hours late or not at all (in this repo about half of them;
  # three slots a day still missed whole days), so the check is scheduled every 2 hours from
  # 05:37 to 17:37 UTC and the later runs stand down once one has run (the due job). Off the
  # full hour, when GitHub delays the most runs.
  schedule:
    - cron: '37 5-17/2 * * *' # from 08:37 in Israel in summer, 07:37 in winter
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: facebook-canary
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-26.04
    outputs:
      run: ${{ steps.today.outputs.run }}
    steps:
      - name: Has today's check run?
        id: today
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          # A run started by hand always runs the checks.
          if [ "$EVENT" != schedule ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # Today's (UTC) other runs on this branch whose checks got to a result, passing or
          # failing; one that was cancelled, timed out or stood down doesn't count. The latest
          # runs are filtered here: the API's own branch= and created= filters once returned
          # nothing for a run that day, and the late slot ran the checks a second time.
          TODAY=$(date -u +%F)
          IDS=$(gh api "repos/$GH_REPO/actions/workflows/facebook-canary.yml/runs?per_page=30" \
            -q ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .head_branch == \"$GITHUB_REF_NAME\"
              and (.created_at | startswith(\"$TODAY\"))) | .id") ||
            { echo "::warning::Couldn't list today's runs: running the checks"; IDS=""; }
          for ID in $IDS; do
            RESULT=$(gh api "repos/$GH_REPO/actions/runs/$ID/jobs" \
              -q '.jobs[] | select(.name == "canary") | .conclusion') || continue
            if [ "$RESULT" = success ] || [ "$RESULT" = failure ]; then
              echo "Today's check already ran: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$ID"
              echo run=false >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo run=true >> "$GITHUB_OUTPUT"

  canary:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: Check the secret
        env:
          FB_TEST_COOKIES: ${{ secrets.FB_TEST_COOKIES }}
          FB_TEST_CHAT: ${{ secrets.FB_TEST_CHAT }}
        run: |
          if [ -z "$FB_TEST_COOKIES" ]; then
            echo "::error::The FB_TEST_COOKIES secret isn't set"
            exit 1
          fi
          # The encoded form goes on the am instrument command line: hidden in the logs too.
          echo "::add-mask::$(printf %s "$FB_TEST_COOKIES" | base64 -w0)"
          # The Messages layer checks' chat (FB_TEST_CHAT, optional): its id stays out of the logs.
          if [ -n "$FB_TEST_CHAT" ]; then
            echo "::add-mask::$FB_TEST_CHAT"
            ID=$(printf %s "$FB_TEST_CHAT" | grep -oE '[0-9]{6,}' | head -n 1 || true)
            if [ -n "$ID" ]; then echo "::add-mask::$ID"; fi
          fi

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      # As in ci.yml: Gradle's build cache, which CI's instrumented shards fill with these same
      # tasks, so main's unchanged code isn't compiled again.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build App and Test APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --build-cache --stacktrace

      # KVM, the emulator and its AVD with the boot snapshot, from the cache when there.
      - name: Emulator AVD
        uses: ./.github/actions/avd

      # Installed with adb rather than connectedAndroidTest: that runs every test class and
      # can't pass the live checks' arguments.
      - name: Run the live checks
        id: checks
        continue-on-error: true
        env:
          FB_TEST_COOKIES: ${{ secrets.FB_TEST_COOKIES }}
          FB_TEST_CHAT: ${{ secrets.FB_TEST_CHAT }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # The screen stays on: with it off the app's WebView is never created (made during
            # layout), and checks failed with "webViews=0".
            adb shell svc power stayon true
            adb shell settings put system screen_off_timeout 1800000
            adb shell input keyevent KEYCODE_WAKEUP
            adb logcat -G 16M
            adb shell am instrument -w -e canary true -e fbCookies "$(printf %s "$FB_TEST_COOKIES" | base64 -w0)" ${FB_TEST_CHAT:+-e fbChat "$FB_TEST_CHAT"} -e class com.astryx.book.LiveFacebookCanaryTest com.astryx.book.test.test/androidx.test.runner.AndroidJUnitRunner | tee canary.txt
            adb logcat -d -v time -s Astryxbook:D AstryxbookPiP:D AstryxbookCanary:D TestRunner:I ActivityTaskManager:I WindowManager:W AndroidRuntime:E chromium:E WebViewFactory:I > canary-logcat.txt || true
            grep -qE '^OK \([0-9]+ tests?\)' canary.txt

      # The device log of a failed run (the app's, the test runner's and WebView's lines).
      - name: Upload the device log
        if: always() && steps.checks.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-logcat
          path: canary-logcat.txt
          retention-days: 14

      # The parts of the checks that had nothing to check this run (LiveFacebookCanaryTest's gap(),
      # "[key] message" lines), kept for the runs after it: "Report gaps" below compares them. The
      # file is kept even with no gap, so the run counts as one where every part was checked; a run
      # whose checks never started keeps none.
      - name: Gaps
        id: gaps
        if: always() && steps.checks.outcome != 'skipped'
        run: |
          if ! grep -q '^com\.astryx\.book\.LiveFacebookCanaryTest' canary.txt 2>/dev/null; then
            echo "The checks didn't run: no gaps kept"
            exit 0
          fi
          { echo "# Parts not checked by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            grep -o 'CANARY GAP: .*' canary.txt | sed 's/^CANARY GAP: //' || true; } > canary-gaps.txt
          echo kept=true >> "$GITHUB_OUTPUT"
      - name: Upload the gaps
        if: always() && steps.gaps.outputs.kept == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-gaps
          path: canary-gaps.txt
          retention-days: 30

      # A part unchecked in this run and the GAP_RUNS - 1 runs of the checks before it opens one
      # issue (or rewrites its text: no daily comments); a run where every such part was checked
      # again closes it. The failing checks' issue is apart: a run can pass with a part long unchecked.
      - name: Report gaps
        if: always() && steps.gaps.outputs.kept == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GAP_RUNS: 7
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Daily Facebook check: parts unchecked for $GAP_RUNS runs"
          while IFS= read -r GAP; do
            if [ -n "$GAP" ]; then echo "::warning title=Live check gap::${GAP//%/%25}"; fi
          done < <(grep -v '^#' canary-gaps.txt)
          # The gaps files of the runs before this one on this branch (runs that stood down or broke
          # before the checks have none), newest first.
          FOUND=0
          for ID in $(gh api "repos/$GH_REPO/actions/workflows/facebook-canary.yml/runs?per_page=50" \
              -q ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .head_branch == \"$GITHUB_REF_NAME\" and .status == \"completed\") | .id"); do
            [ "$FOUND" -lt $((GAP_RUNS - 1)) ] || break
            if gh run download "$ID" -n canary-gaps -D "earlier/$ID" >/dev/null 2>&1; then FOUND=$((FOUND + 1)); fi
          done
          LONG=""
          if [ "$FOUND" -ge $((GAP_RUNS - 1)) ]; then
            for KEY in $(grep -o '^\[[^]]*\]' canary-gaps.txt | sort -u); do
              RUNS=$(grep -lF -- "$KEY" earlier/*/canary-gaps.txt | wc -l)
              if [ "$RUNS" -ge $((GAP_RUNS - 1)) ]; then LONG=$(printf '%s\n%s' "$LONG" "$(grep -F -- "$KEY" canary-gaps.txt | head -1)"); fi
            done
          fi
          if [ -z "$LONG" ]; then
            bash .github/scripts/canary-issue.sh close "$TITLE" "Checked again: $RUN_URL"
            exit 0
          fi
          BODY=$(printf '**%s** at %s: not checked in this run nor the %s before it, so these parts may be broken without a check failing:\n```%s\n```\n\n%s' \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" "${GITHUB_SHA::7}" "$((GAP_RUNS - 1))" "$LONG" "$RUN_URL")
          bash .github/scripts/canary-issue.sh edit "$TITLE" "$BODY"

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.checks.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Daily Facebook check failed"
          # Checks that passed only after working around something (LiveFacebookCanaryTest's note(),
          # e.g. a second Home): a warning on the run, passing or not.
          NOTES=$(grep -o 'CANARY NOTE: .*' canary.txt 2>/dev/null | sed 's/^CANARY NOTE: //' || true)
          while IFS= read -r NOTE; do
            if [ -n "$NOTE" ]; then echo "::warning title=Live check note::${NOTE//%/%25}"; fi
          done <<< "$NOTES"
          if [ "$OUTCOME" = success ]; then
            echo "All live checks passed"
            bash .github/scripts/canary-issue.sh close "$TITLE" "Passing again: $RUN_URL"
            exit 0
          fi
          # The failing checks and their messages (any exception's, java.util's too), without stack
          # traces.
          FAILED=$(grep -E '^(Error in |[0-9]+\) |[a-z][a-z0-9_]*(\.[A-Za-z0-9_$]+)+(Error|Exception)|Process crashed|INSTRUMENTATION_RESULT: shortMsg|Tests run:)' canary.txt 2>/dev/null || true)
          [ -n "$FAILED" ] || FAILED="The checks couldn't run (outcome: $OUTCOME); see the run."
          [ -z "$NOTES" ] || FAILED=$(printf '%s\n\nNotes:\n%s' "$FAILED" "$NOTES")
          BODY=$(printf '**%s** at %s:\n\n```\n%s\n```\n\n%s' "$(date -u '+%Y-%m-%d %H:%M UTC')" "${GITHUB_SHA::7}" "$FAILED" "$RUN_URL")
          bash .github/scripts/canary-issue.sh comment "$TITLE" "$BODY"
          exit 1
