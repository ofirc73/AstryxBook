name: Download stats

# Weekly snapshot of GitHub release download counts. Appends one row per
# release to downloads.csv on the `stats` branch, which is data-only and kept
# off main so these commits never trigger a release.
on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# download-badge.yml pushes to the same branch.
concurrency: stats-branch

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      # main's scripts, and the stats branch (data only) in stats/.
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Checkout stats branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stats
          path: stats

      - name: Append download counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          csv=stats/downloads.csv
          [ -f "$csv" ] || echo "date,tag,downloads" > "$csv"
          # One snapshot a day: a second run (by hand) appended the same date again.
          if grep -q "^$today," "$csv"; then echo "Already taken today"; exit 0; fi
          # Read whole first: a failed page leaves the file as it was.
          downloads=$(.github/scripts/release-downloads.sh)
          printf '%s\n' "$downloads" | awk -F'\t' -v day="$today" '{ print day "," $1 "," $2 }' >> "$csv"

      - name: Commit snapshot
        working-directory: stats
        run: ../.github/scripts/commit-stats.sh "stats: download snapshot $(date -u +%F)" downloads.csv
