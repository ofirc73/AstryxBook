name: Update Stargazers Wall

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: \${{ secrets.OWNER_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Stargazers and Inject into README
        env:
          GITHUB_TOKEN: \${{ secrets.OWNER_PAT }}
        run: |
          cat << 'INNER_EOF' > update_stars.js
          const fs = require('fs');
          const https = require('https');

          const host = String.fromCharCode(97,112,105,46,103,105,116,104,117,98,46,99,111,109); 
          
          const options = {
            hostname: host,
            path: '/repos/ofirc73/AstryxBook/stargazers',
            method: 'GET',
            headers: {
              'User-Agent': 'Node-Stargazers-Bot',
              'Accept': 'application/vnd.github+json',
              'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28'
            }
          };

          const req = https.request(options, (res) => {
            let data = '';
            res.on('data', (chunk) => { data += chunk; });
            res.on('end', () => {
              try {
                const parsed = JSON.parse(data);
                if (parsed.message) {
                  console.error('❌ GitHub API Error:', parsed.message);
                  process.exit(1);
                }
                
                if (!Array.isArray(parsed)) {
                  console.error('❌ Unexpected response format');
                  process.exit(1);
                }

                // Explicitly concatenate clean markdown syntax string segments
                const grid = parsed.map(user => {
                  return '[![' + user.login + '](https://weserv.nl' + user.avatar_url + '&w=50&h=50&fit=cover&mask=circle)](' + user.html_url + ')';
                }).join(' ');

                console.log('DEBUG: Generated grid payload is ->', grid);

                let readmeContent = fs.readFileSync('README.md', 'utf8');
                const startMarker = '<!-- STARGAZERS_START -->';
                const endMarker = '<!-- STARGAZERS_END -->';

                const startIndex = readmeContent.indexOf(startMarker);
                const endIndex = readmeContent.indexOf(endMarker);

                if (startIndex === -1 || endIndex === -1) {
                  console.error('❌ Error: Could not find placeholders in README.md.');
                  process.exit(1);
                }

                const newReadmeSection = startMarker + '\n### ✨ Our Awesome Stargazers\n\n' + grid + '\n\n' + endMarker;
                const updatedReadme = readmeContent.substring(0, startIndex) + newReadmeSection + readmeContent.substring(endIndex + endMarker.length);
                
                fs.writeFileSync('README.md', updatedReadme, 'utf8');
                console.log('✅ README.md updated successfully!');
              } catch (e) {
                console.error('❌ Error parsing payload:', e.message);
                process.exit(1);
              }
            });
          });

          req.on('error', (e) => {
            console.error('❌ Network request error:', e);
            process.exit(1);
          });
          req.end();
          INNER_EOF

          node update_stars.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --exit-code README.md; then
            git add README.md
            git commit -m "docs: update stargazers list in README [skip ci]"
            git push origin main
          else
            echo "ℹ️ No changes detected in README.md by Git."
          fi
