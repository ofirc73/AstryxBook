name: Update Stargazers Wall

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.OWNER_PAT }}

      - name: Fetch Stargazers and Inject Into README
        env:
          GITHUB_TOKEN: ${{ secrets.OWNER_PAT }}
        run: |
          # 1. Query the API endpoint precisely using explicit bearer credentials
          RESPONSE=$(curl -s -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://github.com")
          
          # 2. Check for empty or invalid array objects
          if echo "$RESPONSE" | jq -e '.message' >/dev/null 2>&1; then
            echo "❌ GitHub API Error: $(echo "$RESPONSE" | jq -r '.message')"
            exit 1
          elif [ "$RESPONSE" = "[]" ] || [ -z "$RESPONSE" ]; then
            echo "❌ Error: Received an empty stargazer array."
            exit 1
          fi

          # 3. Format avatars cleanly
          GRID=$(echo "$RESPONSE" | jq -r '.[] | "[![\(@.login)](https://weserv.nl\(@.avatar_url)&w=50&h=50&fit=cover&mask=circle)](\(@.html_url))"' | tr '\n' ' ')
          
          # 4. Inject structural layouts
          NEW_CONTENT="<!-- STARGAZERS_START -->\n### ✨ Our Awesome Stargazers\n$GRID\n<!-- STARGAZERS_END -->"
          perl -0777 -pi -e "s/<!-- STARGAZERS_START -->.*?<!-- STARGAZERS_END -->/$NEW_CONTENT/s" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --exit-code README.md; then
            git add README.md
            git commit -m "docs: update stargazers list in README [skip ci]"
            git push
          fi
