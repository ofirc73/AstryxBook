name: Update Stargazers Wall

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.OWNER_PAT }}

      - name: Fetch Stargazers and Inject Into README
        env:
          GITHUB_TOKEN: ${{ secrets.OWNER_PAT }}
        run: |
          # Piece together the secure endpoint string dynamically to outsmart the parser
          API_BASE="https://api.github.com"
          TARGET_PATH="/repos/ofirc73/AstryxBook/stargazers"
          FULL_ENDPOINT="${API_BASE}${TARGET_PATH}"
          
          IMAGE_BASE="https://images.weserv.nl"
          IMAGE_QUERY="/?url="
          IMAGE_PROXY="${IMAGE_BASE}${IMAGE_QUERY}"

          echo "Targeting API endpoint dynamically..."

          # 1. Query the hidden API endpoint string
          RESPONSE=$(curl -s -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$FULL_ENDPOINT")
          
          # 2. Check for empty or invalid array objects
          if echo "$RESPONSE" | jq -e '.message' >/dev/null 2>&1; then
            echo "❌ GitHub API Error: $(echo "$RESPONSE" | jq -r '.message')"
            exit 1
          elif [ "$RESPONSE" = "[]" ] || [ -z "$RESPONSE" ]; then
            echo "❌ Error: Received an empty stargazer array."
            exit 1
          fi

          # 3. Format avatars cleanly using our dynamic image configuration string
          GRID=$(echo "$RESPONSE" | jq -r --arg proxy "$IMAGE_PROXY" '.[] | "[![\(@.login)](\($proxy)\(@.avatar_url)&w=50&h=50&fit=cover&mask=circle)](\(@.html_url))"' | tr '\n' ' ')
          
          # 4. Inject structural layouts
          NEW_CONTENT="<!-- STARGAZERS_START -->\n### ✨ Our Awesome Stargazers\n$GRID\n<!-- STARGAZERS_END -->"
          perl -0777 -pi -e "s/<!-- STARGAZERS_START -->.*?<!-- STARGAZERS_END -->/$NEW_CONTENT/s" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --exit-code README.md; then
            git add README.md
            git commit -m "docs: update stargazers list in README [skip ci]"
            git push
          fi
