name: Update Stargazers Wall

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.OWNER_PAT }}

      - name: Fetch Stargazers and Inject Into README
        env:
          GITHUB_TOKEN: ${{ secrets.OWNER_PAT }}
        run: |
          API_BASE="https://api.github.com"
          TARGET_PATH="/repos/ofirc73/AstryxBook/stargazers"
          FULL_ENDPOINT="${API_BASE}${TARGET_PATH}"
          
          IMAGE_BASE="https://images.weserv.nl"
          IMAGE_QUERY="/?url="
          IMAGE_PROXY="${IMAGE_BASE}${IMAGE_QUERY}"

          # 1. Query API
          RESPONSE=$(curl -s -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$FULL_ENDPOINT")
          
          if echo "$RESPONSE" | jq -e '.message' >/dev/null 2>&1; then
            echo "❌ GitHub API Error: $(echo "$RESPONSE" | jq -r '.message')"
            exit 1
          fi

          # 2. Extract and format avatars cleanly using proper jq argument parameters
          GRID=$(echo "$RESPONSE" | jq -r --arg proxy "$IMAGE_PROXY" '.[] | "[![" + .login + "](" + $proxy + .avatar_url + "&w=50&h=50&fit=cover&mask=circle)](" + .html_url + ")"' | tr '\n' ' ')
          
          echo "DEBUG: Generated grid payload is -> $GRID"

          # 3. Flexible regex mapping to handle spacing/newlines inside the tags
          NEW_CONTENT="<!-- STARGAZERS_START -->\n### ✨ Our Awesome Stargazers\n$GRID\n<!-- STARGAZERS_END -->"
          
          perl -0777 -pi -e "s/<!--\s*STARGAZERS_START\s*-->.*?<!--\s*STARGAZERS_END\s*-->/$NEW_CONTENT/sg" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          echo "=== SHOWING LOCAL GIT DIFF ==="
          git diff README.md
          echo "=============================="

          if ! git diff --exit-code README.md; then
            git add README.md
            git commit -m "docs: update stargazers list in README [skip ci]"
            git push origin main
          else
            echo "ℹ️ No changes detected in README.md by Git. The placeholder text might not match perfectly."
          fi
