name: Download badge

# The README's downloads badge: the total of every release's GitHub download
# count, written to badge.json on the data-only `stats` branch and shown with
# shields.io's endpoint badge. shields.io's own GitHub downloads badge counts
# only the newest 100 releases, and now and then shows "invalid".
on:
  schedule:
    - cron: '17 */3 * * *'  # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

# download-stats.yml pushes to the same branch.
concurrency: stats-branch

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      # main's scripts, and the stats branch (data only) in stats/.
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Checkout stats branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stats
          path: stats

      - name: Count downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          downloads=$(bash .github/scripts/release-downloads.sh)
          total=$(printf '%s\n' "$downloads" | awk -F'\t' '{ s += $2 } END { print s + 0 }')
          # A failed or empty answer never replaces the last good count.
          [ "$total" -gt 0 ]
          printf '{"schemaVersion":1,"label":"Downloads","message":"%s","color":"1877F2"}\n' "$total" > stats/badge.json

      - name: Commit when the count changed
        working-directory: stats
        run: |
          bash ../.github/scripts/commit-stats.sh "stats: downloads badge $(date -u +%F)" badge.json
